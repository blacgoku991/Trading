# Configuration du bot XAUUSD. Aucun secret ici : ils sont dans .env.
# « Heure serveur » = heure du serveur MT5 d'Axi (voir server_time).

bot:
  # Magic number unique : le bot ne touche jamais une position ou un ordre sans ce magic.
  magic: 20260928
  # Fuseau d'affichage (console, rapports). Stockage interne en UTC.
  display_timezone: Europe/Paris

mt5:
  # Délai d'établissement de la connexion, en ms (défaut officiel : 60000).
  timeout_ms: 60000
  # true seulement si le terminal est lancé avec /portable (check_connection.py le détecte).
  portable: false
  # Reconnexion : attente doublée à chaque échec (1 s, 2 s, 4 s…), plafonnée.
  reconnect:
    base_delay_s: 1.0
    max_delay_s: 60.0
    max_attempts: 8

symbol:
  # "auto" : détection parmi les symboles trouvés par search_group.
  # Sinon, nom exact du symbole (ex. XAUUSD.pro).
  name: auto
  search_group: "*XAU*,*GOLD*"

server_time:
  # Axi : GMT+2 quand New York est en heure d'hiver, GMT+3 en heure d'été
  # => heure serveur = heure de New York + 7 h (docs/RESEARCH.md §1.12).
  reference_timezone: America/New_York
  offset_hours: 7

market_hours:
  # Horaires Axi des métaux, en heure serveur (docs/RESEARCH.md §2.5). Annoncés : reprise à 01:01 ;
  # l'historique Axi 2019-2026 montre une première barre chaque jour à 01:00 : on retient 01:00.
  week_open: "01:00"          # lundi
  week_close: "23:58"         # vendredi
  daily_break_start: "23:59"
  daily_break_end: "01:00"
  # Jours fermés (dates serveur AAAA-MM-JJ), d'après le calendrier Axi.
  closed_dates: []

feed:
  # Pendant les heures de cotation, un tick plus vieux que ce seuil = flux figé.
  stale_after_s: 60
  # Tolérance après chaque ouverture (lundi et fin de la pause quotidienne).
  grace_after_open_s: 300

risk:
  # Défauts du CLAUDE.md §3 (ajustables). Plafond dur : 1 % par trade.
  risk_per_trade_pct: 0.5
  max_daily_loss_pct: 2.0
  max_drawdown_pct: 10.0
  max_open_positions: 2
  max_trades_per_day: 4
  max_consecutive_losses: 3

test_order:
  # check_connection.py --test-order (compte démo uniquement).
  volume: 0.01
  # Distance du SL et du TP, en prix (USD par once). 0,01 lot = 1 oz => 5 USD de risque.
  stop_distance: 5.0
  deviation_points: 20

paths:
  logs: logs
  reports: reports

export:
  # scripts/export_history.py (Windows) : fichiers à m'envoyer ensuite.
  directory: data/export
  # Barres M1 : on remonte mois par mois jusqu'à cette date au plus loin (AAAA-MM-JJ, heure serveur).
  bars_since: "2000-01-01"
  # Ticks : nombre de jours récents exportés (environ 1 Mo par jour de cotation).
  tick_days: 30

backtest:
  # scripts/run_backtest.py. Capital en USD (devise de cotation) : 5 000 € ≈ 5 700 $.
  initial_equity: 5700
  # Les 12 derniers mois sont mis de côté pour la validation finale (utilisés une seule fois).
  out_of_sample_start: "2025-10-01"
  # Spread des barres = spread minimal de la minute (docs/RESEARCH.md annexe E) :
  # plancher à 15 points (spreads nuls en 2019) et glissement de 5 points à chaque exécution défavorable.
  spread_multiplier: 1.0
  min_spread_points: 15
  slippage_points: 5
  # Compte Standard : aucune commission (mesuré en Phase 1).
  commission_per_lot_side: 0.0

strategies:
  asian_breakout:
    # S1 : cassure du range asiatique, heures de Londres.
    range_start: "00:00"
    range_end: "07:00"
    entry_end: "11:00"
    exit_time: "20:00"
    # Paramètres libres (docs/STRATEGIES.md) :
    buffer_atr: 0.05        # marge au-delà du range, en fraction de l'ATR journalier
    tp_r: 1.5               # objectif en multiple du risque
    min_range_atr: 0.15     # range trop étroit : faux signaux
    max_range_atr: 0.8      # range trop large : risque trop grand
  session_momentum:
    # Portefeuille retenu le 29/09/2026 sur la période d'étude, AVANT le test hors échantillon
    # (docs/STRATEGIES.md). Réglages pris au milieu des zones stables, jamais sur le meilleur résultat.
    asie:
      # S8 : pendant la session asiatique, le mouvement du matin a tendance à se retourner.
      # DÉSACTIVÉE : échec hors échantillon (-0,06 R sur 44 trades), hypothèse tirée des données.
      enabled: false
      zone: Asia/Tokyo
      signal_time: "11:00"
      exit_time: "15:00"
      min_move_atr: 0.25    # mouvement minimal depuis l'ouverture, en fraction de l'ATR journalier
      sl_atr: 0.3           # distance du SL, en fraction de l'ATR journalier
      tp_r: 0               # pas de TP : sortie à l'heure
      fade: true
    londres:
      # S7 : le mouvement du matin se prolonge (momentum intraday).
      zone: Europe/London
      signal_time: "10:00"
      exit_time: "16:00"
      min_move_atr: 0.5
      sl_atr: 0.3
      tp_r: 0
    new_york:
      zone: America/New_York
      signal_time: "09:30"
      exit_time: "16:00"
      min_move_atr: 0.5
      sl_atr: 0.3
      tp_r: 0

scalping:
  # EXPÉRIENCE de scalping sur compte DÉMO (scripts/run_scalp.py), séparée de la stratégie Londres / New York.
  # Points de départ expérimentaux, PAS des stratégies annoncées comme rentables. Ne pas modifier pendant
  # la période de collecte : le bot refuse de repartir si ces réglages changent en cours d'expérience.
  magic: 20260929               # différent du bot principal : les deux bots s'ignorent
  candle_seconds: 5             # bougies de 5 s construites à partir des ticks bid/ask (prix médian)
  # Sorties communes aux deux stratégies (comparaison à risque et à sorties égaux).
  stop_buffer_points: 5         # marge au-delà de la structure qui porte le stop
  min_stop_points: 200          # stop d'au moins 2,00 $ (trades démo du 29/09 : stops serrés touchés par le bruit)
  max_stop_points: 600          # et d'au plus 6,00 $
  target_ratio: 3.0             # objectif = 3 x la distance du stop (un gain couvre trois pertes)
  min_target_cost_ratio: 3.0    # objectif >= 3 x le coût estimé (spread + glissements + commission), sinon refus
  expected_slippage_points: 5   # glissement supposé par exécution (filtre de coût et calcul du lot)
  extra_slippage_points: 10     # bilan séparé « simulation avec glissement supplémentaire »
  max_hold_s: 600               # durée maximale (10 min, le temps d'atteindre 3 x le stop) : fermeture même en perte
  # Compte (communs aux deux stratégies).
  # Lot calculé : 0,25 % de l'equity perdus au stop (environ 0,04 lot ; plus gros quand le stop est court). Rejeu
  # v3 : tient les 4 semaines (+175 €) alors que le lot fixe 0,1 atteint l'arrêt à -10 % au 3e jour. Pour revenir
  # au lot fixe (choix de l'utilisateur du 29/09) : ajouter « fixed_volume: 0.1 » et mettre risk_per_trade_pct à 1.0
  # (le risque MAXIMAL d'un trade, plafond dur 1 % : un trade qui risquerait plus est refusé).
  risk_per_trade_pct: 0.25
  max_open_positions: 20        # trades ouverts en même temps : le risque cumulé (2 %) limite avant
  max_total_risk_pct: 2.0       # risque cumulé des trades ouverts
  max_entries_per_minute: 12    # « pas de limite » (utilisateur, 29/09) : une entrée par bougie de 5 s au plus
  min_seconds_between_entries: 5  # une entrée au plus par bougie de 5 s (base)
  daily_loss_pct: 2.0           # plus d'entrée pour la journée au-delà de -2 % (démo, latent compris ; CLAUDE.md §3.5)
  max_drawdown_pct: 10.0        # -10 % depuis le plus haut de l'expérience : arrêt total, relance manuelle
  # « Toujours dans le bon sens » : trades seulement dans le sens du mouvement du jour (prix - ouverture du jour)
  # quand il atteint 0,5 x l'ATR journalier (moyenne simple de 14 jours) ; aucun trade sinon. Idée du S7, seul
  # avantage validé hors échantillon. Rejeu 4 semaines : +208 pips, PF 1,07, trop court pour être une preuve.
  direction_filter: true
  direction_min_move_atr: 0.5
  min_free_margin_pct: 50       # marge libre après l'ordre >= 50 % de l'equity, sinon refus
  experiment_days: 10           # durée annoncée de la collecte (jours de cotation)
  breakout:
    # « cassure » v1 : clôture au-delà du plus haut / plus bas des 60 s précédentes (bougie de signal exclue),
    # confirmée par une 2e clôture, dans le sens de la tendance M1 (EMA20 / EMA50 sur barres clôturées).
    enabled: true
    version: 1
    lookback_s: 60
    min_window_candles: 6         # au moins 6 bougies dans ces 60 s (sinon marché trop calme ou trou)
    confirm_closes: 2
    ema_fast: 20
    ema_slow: 50
    stop_lookback_s: 30           # stop derrière la structure des 30 dernières secondes
  pullback:
    # « impulsion-repli » v1 (principe public « impulsion puis correction », règles écrites ici, pas le code
    # d'un produit commercial) : impulsion >= 1 ATR M1 en 60 s au plus, repli de 30 à 70 % de l'impulsion,
    # puis clôture au-dessus du plus haut de la bougie précédente (au-dessous du plus bas pour une vente)
    # dans les 60 s qui suivent le sommet de l'impulsion. Stop derrière le point bas du repli.
    # Désactivée en démo le 29/09 : perdante dans toutes ses versions (sorties v2 seule : PF 0,84, -0,12 R).
    enabled: false
    version: 1
    impulse_atr: 1.0
    impulse_max_s: 60
    retrace_min: 0.3
    retrace_max: 0.7
    pullback_max_s: 60
    atr_period: 14
  learning:
    # « apprend à chaque trade » v2 : chaque signal est aussi simulé avec d'autres variantes (stop x1 / x1,5 / x2,
    # objectif 2 / 3 / 4 R, et à l'envers : vendre quand le signal dit d'acheter). Après chaque trade simulé
    # fermé, le score de la variante est mis à jour (les trades récents pèsent plus), séparément pour les achats et
    # les ventes de chaque stratégie. Au signal suivant : la meilleure variante du moment, ou aucun trade si toutes
    # perdent. Rejeu sur 4 semaines : perd moins que sans apprentissage, mais perd (docs/STRATEGIES.md).
    enabled: true
    version: 2                    # v1 : objectifs 0,8 / 1,2 / 2 R
    by_side: true
    allow_invert: true
    half_life_trades: 100
    min_trades: 20
    always_trade: false
    stop_mults: [1.0, 1.5, 2.0]
    target_ratios: [2.0, 3.0, 4.0]
  cadence:
    # « plus de trades par minute, sans limite, tant qu'il génère du bénéfice » (demande du 29/09/2026).
    # Après chaque trade fermé : si les 30 derniers trades sont en bénéfice net (frais compris), les limites de
    # base (entrées par minute, positions, risque cumulé) sont multipliées par le palier suivant (x2, x4, x6), au plus
    # un palier par série de 30 trades ; dès qu'ils sont en perte nette, retour immédiat à la base.
    # Le risque par trade (0,1 %) ne change jamais. Plafonds absolus ci-dessous.
    enabled: true
    version: 1
    window_trades: 30
    multipliers: [1, 2, 4, 6]
    ceiling_entries_per_minute: 12  # une par bougie de 5 s au plus ; requêtes serveur, pas de HFT chez Axi
    ceiling_total_risk_pct: 2.0     # risque ouvert jamais au-delà de la perte journalière maximale (daily_loss_pct)

logging:
  level: INFO
  max_bytes: 5000000
  backup_count: 10
